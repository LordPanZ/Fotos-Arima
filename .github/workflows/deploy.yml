name: Publicar en GitHub Pages

on:
  push:
  # Permite publicar a mano desde cualquier rama (Actions › Ejecutar workflow).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    # Solo publica la rama por defecto del repositorio, se llame como se llame.
    # Así el workflow sigue funcionando si un día se renombra a «main», y las
    # ramas de trabajo no pisan el sitio publicado.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar para Pages
        # La app vive en https://usuario.github.io/<repo>/, así que la base
        # tiene que llevar el nombre del repositorio con sus mayúsculas: las
        # rutas de GitHub Pages distinguen mayúsculas de minúsculas.
        run: |
          export VITE_BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "Compilando con VITE_BASE=$VITE_BASE"
          npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5
        with:
          # Activa Pages en el repositorio la primera vez, sin tener que
          # tocarlo a mano en Settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
